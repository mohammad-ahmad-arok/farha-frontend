name: final_farha_pro
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  date_format: ^2.0.9
  flutter_svg: ^2.0.9
  google_fonts: ^8.0.2
  smooth_page_indicator: ^2.0.1
  video_player: ^2.8.2
  image_picker: ^1.0.7
  dotted_border: ^2.1.0
  table_calendar: ^3.0.9
  url_launcher: ^6.2.5
  font_awesome_flutter: ^10.7.0
  screenshot: ^3.0.0
  get: ^4.6.6
  path_provider: ^2.1.2
  flutter_colorpicker: ^1.0.3
  gal: ^2.3.0
  permission_handler: ^11.0.1
  audioplayers: ^5.2.1
  shared_preferences: ^2.2.2
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  flutter_lints: ^6.0.0

# --- قسم إعدادات شاشة البداية (منفصل وفي أقصى اليسار) ---
flutter_native_splash:
  color: "#ffffff"
  android_12:
    color: "#ffffff"
  image: "assets/gray.webp"
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/audios/

  fonts:
    - family: BahijTheSansArabic
      fonts:
        - asset: assets/fonts/Bahij_TheSansArabic-Bold.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
    - family: ArefRuqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-Regular.ttf
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri-VariableFont_wght.ttf
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
    - family: Mada
      fonts:
        - asset: assets/fonts/Mada-VariableFont_wght.ttf
    - family: Mirza
      fonts:
        - asset: assets/fonts/Mirza-Regular.ttf
    - family: MarkaziText
      fonts:
        - asset: assets/fonts/MarkaziText-VariableFont_wght.ttf
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-VariableFont_wght.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf